name: Snippet retirement diagnostics
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "Paired rounds (1-1000); non-reproduction remains inconclusive"
        default: "200"
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-paired-observation:
    # No write permission, OIDC, or persisted checkout credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Immutable original source (failed run 39971697137, attempt 1)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c00f9f990f201340b27658dcb525ddcdb14c08ec
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Independently install both frozen dependency graphs
        run: |
          (cd baseline && bun install --frozen-lockfile --ignore-scripts)
          (cd candidate && bun install --frozen-lockfile --ignore-scripts)
      - name: Require Linux Python pidfd capability (no rescue fallback)
        working-directory: candidate
        run: |
          python3 scripts/fixtures/snippet-retirement-pidfd.py --probe | python3 -c 'import json,sys; assert json.load(sys.stdin).get("supported") is True'
      - name: Fast diagnostic unit tests
        working-directory: candidate
        run: node --test scripts/snippet-retirement-diagnostics.test.mjs
      - name: Alternating paired rounds on this one native VM (not a matrix)
        env:
          PAIRS: ${{ inputs.pairs || '200' }}
        run: node candidate/scripts/snippet-retirement-diagnostics.mjs baseline candidate diagnostic-evidence "$PAIRS" primary
      - name: Evidence summary (not an issue-closure gate)
        if: always()
        run: |
          if [ -f diagnostic-evidence/summary.json ]; then
            node -e 'const s=require("./diagnostic-evidence/summary.json"); require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Snippet retirement evidence\n" + s.evidence + "\n\nHarness success: " + s.harnessSuccess + "; baseline failures: " + s.baselineFailures + "; candidate failures: " + s.fixedFailures + "; closure authorized: false\n");'
          else
            printf '%s\n' 'INCONCLUSIVE: diagnostic setup did not produce a summary; no closure evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Narrow PID/timeline/hash evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snippet-retirement-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-evidence/*.json*
          if-no-files-found: warn
          retention-days: 30
